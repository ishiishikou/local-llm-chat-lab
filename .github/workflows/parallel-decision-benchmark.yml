name: Benchmark parallel shared-prefix decisions

on:
  workflow_dispatch:
  push:
    branches:
      - bench/parallel-questions
    paths:
      - ".github/workflows/parallel-decision-benchmark.yml"
      - "bench/parallel-questions/**"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Record runner CPU
        run: |
          lscpu | tee runner-lscpu.txt
          nproc | tee runner-nproc.txt

      - name: Build pinned llama.cpp and benchmark
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git vendor/llama.cpp
          git -C vendor/llama.cpp checkout e613ef2c81bae98d59850d061ac29e6e3e88cb00
          git -C vendor/llama.cpp rev-parse HEAD | tee llama-cpp-revision.txt
          mkdir -p vendor/llama.cpp/examples/parallel-decision-bench
          cp bench/parallel-questions/parallel_decision_bench.cpp vendor/llama.cpp/examples/parallel-decision-bench/parallel_decision_bench.cpp
          cp bench/parallel-questions/CMakeLists.txt vendor/llama.cpp/examples/parallel-decision-bench/CMakeLists.txt
          printf '\nadd_subdirectory(parallel-decision-bench)\n' >> vendor/llama.cpp/examples/CMakeLists.txt
          cmake -S vendor/llama.cpp -B vendor/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF \
            -DBUILD_SHARED_LIBS=OFF -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON -DLLAMA_BUILD_TOOLS=OFF
          cmake --build vendor/llama.cpp/build --target llama-parallel-decision-bench -j2

      - name: Download and verify benchmark model
        run: |
          curl -L --fail --retry 5 --retry-delay 3 \
            -o Qwen3.5-4B.Q4_K_M.gguf \
            "https://huggingface.co/mradermacher/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B.Q4_K_M.gguf?download=true"
          sha256sum Qwen3.5-4B.Q4_K_M.gguf | tee model-sha256.txt
          echo "51eafbc127f35598c8f1d2ec58b2520d6126c7d1195c4eca26832e63a2939d39  Qwen3.5-4B.Q4_K_M.gguf" | sha256sum -c -

      - name: Run sequential-to-batched scaling benchmark
        run: |
          set +e
          /usr/bin/time -v vendor/llama.cpp/build/bin/llama-parallel-decision-bench \
            -m Qwen3.5-4B.Q4_K_M.gguf --threads 4 \
            > benchmark.jsonl 2> benchmark.stderr
          rc=$?
          echo "$rc" | tee benchmark.exit
          cat benchmark.jsonl
          tail -120 benchmark.stderr
          exit "$rc"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-decision-benchmark-results
          path: |
            benchmark.jsonl
            benchmark.stderr
            benchmark.exit
            runner-lscpu.txt
            runner-nproc.txt
            llama-cpp-revision.txt
            model-sha256.txt
          retention-days: 14
